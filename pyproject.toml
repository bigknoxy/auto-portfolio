[project]
name = "auto-portfolio"
version = "0.1.0"
description = "Zero-input portfolio generator from git history"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.40",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tomli>=2.0.1",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
playwright = [
    "playwright>=1.43.0",
]

[project.scripts]
auto-portfolio = "auto_portfolio_cli.auto_portfolio:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "cli*", "data*", "auto_portfolio_cli*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
